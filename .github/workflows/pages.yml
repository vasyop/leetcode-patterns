name: Deploy the book site

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# let an in-flight deploy finish rather than cancelling it mid-publish
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4

            # assemble explicitly, so .git and .github never reach the published site
            - name: Assemble the site
              run: |
                  mkdir -p _site
                  cp index.html _site/
                  cp -r assets _site/
                  cp -r content _site/
                  touch _site/.nojekyll

            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: _site
            - id: deploy
              uses: actions/deploy-pages@v4
